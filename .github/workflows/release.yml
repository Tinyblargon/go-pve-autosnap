name: Release

on:
  release:
    types: [created]

permissions:
  contents: write

jobs:
  release:
    name: Build and Release
    runs-on: ubuntu-latest

    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
            name: go-pve-autosnap-linux-amd64
          - goos: linux
            goarch: arm64
            name: go-pve-autosnap-linux-arm64

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 0
        run: |
          mkdir -p dist 
          make build output="dist/${{ matrix.name }}" version=${{ github.ref_name }}

      - name: Generate SHA-256 hash
        run: |
          cd dist
          sha256sum "${{ matrix.name }}" > "${{ matrix.name }}.sha256"

      - name: Upload release assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: |
            dist/${{ matrix.name }}
            dist/${{ matrix.name }}.sha256
